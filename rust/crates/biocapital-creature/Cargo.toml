tracing = { workspace = true }
uuid = { workspace = true }
# `biocapital-creature::domain::creature::DropPartDevGate` re-uses
# the 12-value BodyPart enum from `biocapital-core::player_state`.
# This keeps the wire form (SCREAMING_SNAKE_CASE) and the PG
# `body_part_development.part_name` CHECK constraint in lock-step.
biocapital-core = { path = "../biocapital-core" }
biocapital-pg = { path = "../biocapital-pg" }

[dev-dependencies]
filetime = "0.2"
tempfile = "3"
tokio = { workspace = true }
