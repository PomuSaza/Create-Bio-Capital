// ── Bank ────────────────────────────────────
// 2026-06-14 task #83 (18-tg-whitelist): 5 new RPCs appended for
// the hardware-token subsystem; TokenResponse / TokenListResponse
// are reused from the DglabService definition below.
service BankService {
  rpc GetBalance(AccountRequest) returns (BalanceResponse);
  rpc Deposit(DepositRequest) returns (BalanceResponse);
  rpc Withdraw(WithdrawRequest) returns (BalanceResponse);
  rpc Transfer(TransferRequest) returns (BalanceResponse);
  rpc GetHistory(HistoryRequest) returns (HistoryResponse);
  rpc LockDevice(LockDeviceRequest) returns (LockDeviceResponse);
  rpc UnlockDevice(UnlockDeviceRequest) returns (LockDeviceResponse);
  rpc GenerateInviteCode(AccountRequest) returns (InviteCodeResponse);
  rpc AcceptInviteCode(AcceptInviteRequest) returns (LockDeviceResponse);

  // ── 硬件 token 子系统（doc/18 §7）──────────────────
  // Authenticate 排在最末（method_id = 9）；前面的 9 个 RPC
  // method_id 0..=8 在 BankManager.java 的 callBank(methodId, ...)
  // dispatch 中已固定。Authenticate 在 Java 端用 methodId = 9
  // 调 NativeRustBindings.callBank(9, ...)。18 §3.1 玩家登录
  // 时序：Java 端 PlayerLoggedInEvent → callAuthenticate(9, ...)
  // → 拒绝时 disconnect(reason)。
  rpc RequestHardwareToken(AccountRequest) returns (TokenResponse);
  rpc BindHardware(BindHardwareRequest) returns (TokenResponse);
  rpc ListHardware(AccountRequest) returns (TokenListResponse);
  rpc RevokeHardware(RevokeHardwareRequest) returns (TokenResponse);
  rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse);
}

// 2026-06-14 task #83 (18-tg-whitelist §7): hardware-token 子系统的 4 个新 message
