// ── DG_LAB ──────────────────────────────────
// 2026-06-14 晚 user task #110: 服务从 5 RPC 扩到 8 RPC（+GetPlayerConfig /
// +SetPlayerConfig / +AdminOverride）。Range 0..=200 per channel（10 §2.5）；
// trigger_source 6 值（10 §3.2）；audit_dglab.op 9 值（10 §5 + §3.4 + §3.5）。
service DglabService {
  // 原有 5 RPC
  rpc SetStrength(SetStrengthRequest) returns (SetStrengthResponse);
  rpc GetStrength(AccountRequest) returns (StrengthResponse);
  rpc GenerateToken(AccountRequest) returns (TokenResponse);
  rpc RevokeToken(TokenRequest) returns (TokenResponse);
  rpc ListTokens(ListRequest) returns (TokenListResponse);

  // 新增 3 RPC（10 §3.2 + §3.4 + §3.5，task #110）
  rpc GetPlayerConfig(AccountRequest) returns (PlayerDglabConfig);
  rpc SetPlayerConfig(SetPlayerConfigRequest) returns (PlayerDglabConfig);
  rpc AdminOverride(AdminOverrideRequest) returns (PlayerDglabConfig);
}

message SetStrengthRequest {
  PlayerIdentifier player = 1;
  int32 channel = 2;             // 0 = A, 1 = B
  int32 strength = 3;            // 0..=200 per channel（10 §2.5）
  string source = 4;             // "PLEASURE_CHANGE" | "DAMAGE_TRIGGER" | "ADMIN_OVERRIDE" | "BIOCAPITAL_REWARD" | "IDLE" | "CLIENT"（10 §3.2 + §4.3 + dglab_strength_log.trigger_source）
  Uuid request_id = 5;
}

message SetStrengthResponse {
  bool success = 1;
  int32 new_strength = 2;
  int32 max_strength_applied = 3;// 服务器 max_strength 限制（10 §4.2, 0..=200）
}

// 10 §3.2 + §3.5：玩家自设 DG_LAB 强度配置（base/max/waveform）。
// 字段顺序：player_uuid → base → max → waveform_a → waveform_b →
// updated_tick → has_active_override → override_expires_at。
message PlayerDglabConfig {
  Uuid player_uuid = 1;
  int32 base_intensity = 2;        // 0..=200（默认 60）
  int32 max_intensity = 3;         // 0..=200（默认 80, max >= base 由 CHECK 约束）
  string waveform_a = 4;           // 15 种官方 id（10 §2.11）；默认 "continuous"
  string waveform_b = 5;           // 15 种官方 id（10 §2.11）；默认 "pulse"
  int64 updated_tick = 6;
  bool has_active_override = 7;    // 当前是否有 OP 覆写（10 §3.4）
  google.protobuf.Timestamp override_expires_at = 8;  // 最近的 active 覆写过期时间
}

message SetPlayerConfigRequest {
  Uuid player_uuid = 1;
  int32 base_intensity = 2;        // 0..=200
  int32 max_intensity = 3;         // 0..=200, must be >= base
  string waveform_a = 4;           // 15 种官方 id
  string waveform_b = 5;           // 15 种官方 id
}

// 10 §3.4：OP 临时覆写。`param` 取 5 值之一：
//   "base" | "max" | "waveform_a" | "waveform_b" | "clear"
// 当 param=base/max → value_int (0..=200)，value_str 空；
// 当 param=waveform_a/waveform_b → value_str (15 种官方 id)，
//   value_int 留空；
// 当 param=clear → 两个 value 都空（立即清除该玩家所有 active 覆写）。
message AdminOverrideRequest {
  Uuid target_player_uuid = 1;
  string param = 2;                // "base" / "max" / "waveform_a" / "waveform_b" / "clear"
  int32 value_int = 3;             // 当 param=base/max（0..=200）
  string value_str = 4;            // 当 param=waveform_a/waveform_b（15 官方 id）
  int32 duration_seconds = 5;      // 持续时间（秒）；0 = 立即清除
  Uuid issued_by = 6;              // OP 玩家 UUID
}

message StrengthResponse {
  int32 channel_a = 1;
  int32 channel_b = 2;
  int32 max_strength = 3;        // 当前限制值（0..=200, 10 §4.2）
  bool player_online = 4;        // 离线时强度强制 = 0（10 §4.2）
}

message TokenRequest {
  string token = 1;
}

// inferred from 10 §5 dglab_tokens SQL
message TokenResponse {
  string token = 1;              // dglab_tokens.token（UUIDv4）
  Uuid owner_uuid = 2;           // dglab_tokens.owner_uuid
  int64 created_tick = 3;        // dglab_tokens.created_tick
  int64 last_used_tick = 4;      // dglab_tokens.last_used_tick
  bool enabled = 5;              // dglab_tokens.enabled
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp last_used_at = 7;
}

message TokenListResponse {
  repeated TokenResponse tokens = 1;
  int32 total_count = 2;
}

// ── Audit ───────────────────────────────────
service AuditService {
  rpc Query(AuditQueryRequest) returns (AuditQueryResponse);
  rpc Export(AuditExportRequest) returns (ExportResponse);
}

// inferred from 12 §2.12 + 99 §2.2 审计强制字段
message AuditQueryRequest {
  string table = 1;              // "audit_bank" | "audit_dglab" | "audit_admin"
  Uuid actor_uuid = 2;           // 99 §2.2
  string actor_type = 3;         // "PLAYER" | "ADMIN_CMD" | "RUST_SERVICE" | "HARDWARE_DGLAB"
  Uuid target_uuid = 4;
  string target_type = 5;        // "PLAYER" | "BANK_ACCOUNT" | "CONTRACT" | "CORE_POD"
  string op = 6;                 // "bank.transfer" | "pod.produce" | "contract.sign" | ...
  google.protobuf.Timestamp from = 7;
  google.protobuf.Timestamp to   = 8;
  int32 limit = 9;
  int64 before_tick_millis = 10; // 翻页游标
}

message AuditQueryResponse {
  repeated AuditRow rows = 1;
  int64 next_before_tick_millis = 2;
}

// inferred from 99 §2.2 审计日志强制字段（actor / target / op / before / after / tick / request_id）
message AuditRow {
  Uuid actor_uuid = 1;
  string actor_type = 2;         // enum-as-string
  Uuid target_uuid = 3;
  string target_type = 4;        // enum-as-string
  string op = 5;                 // e.g. "bank.transfer"
  string before_json = 6;        // 99 §2.2 before JSONB
  string after_json = 7;         // 99 §2.2 after JSONB
  int64 tick_millis = 8;         // 99 §2.2 tick_millis
  Uuid request_id = 9;           // 99 §2.2 request_id
  google.protobuf.Timestamp at = 10;
  string notes_json = 11;        // 可选备注（audit_bank.notes JSONB）
}

message AuditExportRequest {
  string table = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to   = 3;
  string format = 4;             // "csv" | "json"
  Uuid actor_uuid = 5;
  string op = 6;
}

message ExportResponse {
  bytes payload = 1;
  string content_type = 2;
  int64 row_count = 3;
}
