  Uuid player_uuid = 1;
  float pleasure = 2;
  float hunger = 3;
  float hidden_hp = 4;
  int32 low_hp_hits = 5;
  // key ∈ {HEAD, NECK, CHEST, BELLY, GENITAL, BUTT, BACK, LEFT_ARM, RIGHT_ARM, LEFT_LEG, RIGHT_LEG, FEET} (12 parts, see 03-body-development.md §1.1)
  map<string, float> parts = 6;  // BodyPart name -> dev value
