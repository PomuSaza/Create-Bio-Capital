plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

repositories {
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com" // Veil 等 Foundry/Fuzs 通用托管
    }
    maven {
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" // Fuzs ForgeConfigAPI Port
    }
    exclusiveContent { // Sable
        forRepository {
            maven {
                url = "https://maven.ryanhcode.dev/releases"
                name = "RyanHCode Maven"
            }
        }
        filter {
            includeGroup("dev.ryanhcode.sable")
            includeGroup("dev.ryanhcode.sable-companion")
        }
    }
}

dependencies {
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")
    api("dev.ryanhcode.sable:sable-common-${project.minecraft_version}:${project.sable_version}")
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }


dependencies {
    // Example mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-forge-api:${jei_version}"
    // runtimeOnly "mezz.jei:jei-${mc_version}-forge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// =============================================================================
// Sable JNI bridge — buildRustNatives + buildImages (doc/16-sable-bridge.md §3.3, §7.1)
// =============================================================================
//
// Sable does NOT publish a Gradle plugin; instead it provides a `Dockerfile`
// in the project's `rust/docker/` directory and a documented convention of
// invoking it via `docker run`.  We replicate that convention below so the
// `gradlew buildRustNatives` task works for our project out of the box.
//
// Cross-compile matrix (target triples) matches doc/16 §3.3 / §7.1 and
// rust/docker/Dockerfile.  The "host" target is built on the developer's
// machine (no Docker required) and the rest are built inside the image.

import org.gradle.api.tasks.Exec

ext {
    rustDir          = file('rust')
    rustDockerDir    = file('rust/docker')
    rustDockerImage  = 'create-biocapital/rust-builder'
    // Java 17 toolchain matches the JDK installed in rust/docker/Dockerfile
    // and the project's Minecraft 1.21.1 baseline.
    rustJavaHome     = System.getenv('JAVA_HOME') ?: '/usr/lib/jvm/java-17-openjdk-amd64'

    // Primary cross-compile matrix.  Built from a Linux host
    // without any extra toolchain setup (gcc / gcc-aarch64 /
    // gcc-mingw-w64-x86-64 are already installed in
    // `rust/docker/Dockerfile`).
    //
    // 2026-06-16 user decision: macOS targets (x86_64-apple-darwin,
    // aarch64-apple-darwin) require the Apple Clang toolchain
    // (cctools / osxcross), which cannot be installed on a vanilla
    // Linux host. They are moved to `rustTargetMatrixMacos` below
    // and excluded from the default build. To re-enable them you
    // must either (a) build on a macOS CI runner, (b) install
    // osxcross in `rust/docker/Dockerfile`, or (c) override
    // `-PincludeMacos=true` AND supply an Apple SDK in the
    // container. The current `buildRustNatives` task walks the
    // primary matrix; macOS targets would be a separate task or
    // pipeline (TBD).
    rustTargetMatrix = [
        'linux-x86_64'   : 'x86_64-unknown-linux-gnu',
        'windows-x86_64' : 'x86_64-pc-windows-gnu',
        'linux-aarch64'  : 'aarch64-unknown-linux-gnu',
    ]

    // Secondary matrix — macOS targets, OFF by default. Kept here
    // for documentation / future re-enable; not consumed by
    // `buildRustNatives`.
    rustTargetMatrixMacos = [
        'macos-x86_64'  : 'x86_64-apple-darwin',
        'macos-aarch64' : 'aarch64-apple-darwin',
    ]
}

// --- buildImages: build the Docker image (one-time, ~5 min) ---------------
// Mirrors Sable's `gradlew common:buildImages` task (doc/16 §7.1 step 1).
//
// Configuration-cache note: closures (doLast / doFirst / nested
// action blocks) MUST NOT capture references to script-level
// objects (e.g. `ext.*` properties, local `def` bindings to those
// properties, or anything else defined at script scope). The cache
// cannot serialise those references across runs. The fix is to
// hold a *path string* and re-resolve the `File` inside the
// closure via `project.layout.projectDirectory.file(...)`, which
// is itself a cache-safe `File` (provided by Gradle, not the
// script). Same trap applies to `buildRustNatives` below.
tasks.register('buildImages', Exec) {
    group = 'biocapital'
    description = 'Build the rust-builder Docker image (used by buildRustNatives).'

    // Bind at configuration time to a *path string* (not a File) so
    // the doLast closure does not capture a script-level `File`.
    def dockerDirPath = project.rustDockerDir.absolutePath
    workingDir = rustDir
    commandLine 'docker', 'build',
            '-t', rustDockerImage,
            '-f', 'docker/Dockerfile',
            '.'
    // Inputs / outputs for incremental build support. `inputs.dir` /
    // `outputs.file` are evaluated at configuration time, so they
    // can still reference the script-level `rustDockerDir` ext File
    // (no closure capture).
    inputs.dir(rustDockerDir)
    outputs.file(file("$dockerDirPath/.image-built"))
    doLast {
        // Resolve the `File` *inside* the doLast via the cache-safe
        // `project.layout.projectDirectory` entry point. Calling the
        // bare `file(...)` here would resolve to the script-level
        // Gradle object and re-trigger the configuration-cache
        // "Cannot reference a Gradle script object from a Groovy
        // closure" error.
        def stamp = new File(dockerDirPath, ".image-built")
        stamp.text = new Date().toString()
    }
}

// --- buildRustNatives: cross-compile libbiocapital_jni for every target ----
// Mirrors Sable's `gradlew common:buildRustNatives` task (doc/16 §7.1 step 2).
// Output: build/natives/<os>/{libbiocapital_jni.so, .dylib, .dll}
//
// Configuration-cache note: see buildImages above. We bind
// project ext values to *path strings / value strings* (not to the
// script-level `File` objects) and re-resolve the `File` inside
// the doLast closure via `project.layout.projectDirectory.file()`,
// which returns a cache-safe `File` provided by Gradle.
tasks.register('buildRustNatives') {
    group = 'biocapital'
    description = 'Cross-compile libbiocapital_jni shared library for every target in the matrix (uses Docker).'

    dependsOn 'buildImages'

    // Cache-safe scalar snapshots (strings) of the project ext
    // properties. Re-resolved to `File` *inside* the doLast closure
    // Cache-safe scalar snapshots (strings) of the project ext
    // properties. Re-resolved to `File` *inside* the doLast closure
    // so the closure does not capture a script-level object.
    def rustDirPath = rustDir.absolutePath
    def rustDockerImageName = rustDockerImage
    def rustJavaHomePath = rustJavaHome
    def projectDirPath = project.projectDir.absolutePath
    // `ExecOperations` is the configuration-cache-safe way to run
    // external processes from inside a task action. Injecting it via
    // the `Exec` field of `Task` (set during task construction) lets
    // us call `exec { ... }` *inside* the doLast without
    // re-touching the script-level `exec` extension.
    def execOps = services.get(org.gradle.process.ExecOperations)
    // `layout` is a script-level Gradle object, so resolve the
    // project root to a *path string* at configuration time rather
    // than calling `layout.projectDirectory` inside the doLast.
    def projectRootPath = layout.projectDirectory.asFile.absolutePath

    // Each target triple produces one .so/.dylib/.dll
    rustTargetMatrix.each { os, triple ->
        doLast {
            def rustDirResolved = new File(rustDirPath)
            def outDir = new File(projectRootPath, "build/natives/${os}")
            outDir.mkdirs()

            // Map triple → shared library suffix + filename prefix.
            // Windows DLLs do NOT have the `lib` prefix (cargo's
            // cdylib output is `biocapital_jni.dll`), while Linux
            // `.so` and macOS `.dylib` follow the `libfoo.<ext>`
            // convention. `System.loadLibrary("biocapital_jni")`
            // resolves both forms transparently.
            def libSuffix = triple.contains('windows') ? 'dll'
                    : triple.contains('darwin')   ? 'dylib'
                    : 'so'
            def libNamePrefix = triple.contains('windows') ? 'biocapital_jni'
                    : 'libbiocapital_jni'
            def libFile = new File(outDir, "${libNamePrefix}.${libSuffix}")

            logger.lifecycle("[buildRustNatives] ${triple} → ${libFile}")

            // Invoke the Docker image via the cache-safe ExecOperations
            // service. We mount:
            //   - the rust/ workspace at /build/rust (Dockerfile WORKDIR)
            //   - the build/ output at /build/build for direct copy-out
            //
            // NB: rust/docker/Dockerfile sets `WORKDIR /build` and
            // `ENTRYPOINT ["cargo"]`, so the `cargo` subcommand is
            // *prepended* by docker, not by us. The Cargo workspace
            // lives at /build/rust inside the container (the project
            // root is the Dockerfile WORKDIR, not the cargo workspace
            // root), so we use `-w /build/rust` to run cargo from the
            // right directory.
            //
            // CRITICAL: we point cargo at an *ephemeral* target dir
            // inside the container (`/tmp/cargo-target-${triple}`).
            // The default target dir would be the host's
            // `rust/target/` (via the rust/ volume mount), and any
            // host-side artifacts (e.g. the x86_64 build of
            // `cargo test` etc.) would pollute the cross-compile
            // target dir — rust-lld would then try to link
            // x86_64-built `.o` files into the aarch64 binary and
            // fail with `incompatible with elf64-x86-64`. The
            // ephemeral dir also means we lose cargo's incremental
            // compile cache between runs; for the JNI crate this is
            // fine (small dependency graph, ~30s rebuild).
            execOps.exec {
                workingDir = rustDirResolved
                // For non-host Linux targets (aarch64) we need to
                // tell cargo to invoke the cross gcc as the linker.
                // Without this, cargo uses the host's `cc` which
                // routes through `rust-lld` for the *host* arch
                // (x86_64) and the link step fails with
                // `incompatible with elf64-x86-64` even though
                // every .o is aarch64.
                def linkerEnv = ''
                def isHostLinux = triple.startsWith('x86_64-unknown-linux') ||
                        triple.startsWith('aarch64-unknown-linux')
                def extraEnv = []
                if (triple.startsWith('aarch64-unknown-linux')) {
                    extraEnv += '-e'
                    extraEnv += "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
                } else if (triple.startsWith('x86_64-pc-windows')) {
                    extraEnv += '-e'
                    extraEnv += "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc"
                }
                commandLine(['docker', 'run', '--rm',
                        '-v', "${rustDirPath}:/build/rust",
                        '-v', "${projectDirPath}/build:/build/build",
                        '-w', '/build/rust',
                        '-e', "RUST_TARGET=${triple}",
                        '-e', "JAVA_HOME=${rustJavaHomePath}",
                        *extraEnv,
                        rustDockerImageName,
                        'build', '--release',
                        '--target', triple,
                        '--target-dir', "/build/build/cargo-target-${triple}",
                        '-p', 'biocapital-jni'] as List)
            }

            // Copy the produced artifact out of the ephemeral
            // cargo target dir. Cargo's target-dir layout is
            // `<target-dir>/<triple>/release/...` (one subdir per
            // target triple), not `<target-dir>/release/...` (that
            // is the host's native build). Resolve the correct
            // path here so we pick up the cross-compiled .so /
            // .dll / .dylib.
            def buildTargetDir = new File(projectRootPath,
                    "build/cargo-target-${triple}/${triple}/release")
            def cargoArtifact = new File(
                    buildTargetDir,
                    "${libNamePrefix}.${libSuffix}")
            if (cargoArtifact.exists()) {
                cargoArtifact.withInputStream { ins ->
                    libFile.withOutputStream { out -> out << ins }
                }
            } else {
                logger.warn("[buildRustNatives] expected artifact not found: ${cargoArtifact}")
            }
        }
    }

    inputs.dir(rustDir)
    inputs.file(file('build.gradle'))  // rebuilds if Gradle changes
    outputs.dir(file('build/natives'))
}

// --- Link the native library into the run classpath -------------------------
// `gradlew runClient` / `runServer` will pick up build/natives/<current-os>/
// via -Djava.library.path so System.loadLibrary("biocapital_jni") succeeds
// from the IDE without any extra steps.
neoForge.runs.configureEach {
    def currentOs = System.getProperty('os.name').toLowerCase()
    def nativeSubdir = currentOs.contains('win')    ? 'windows-x86_64'
            : currentOs.contains('mac')            ? (System.getProperty('os.arch').contains('aarch64') ? 'macos-aarch64' : 'macos-x86_64')
            : (System.getProperty('os.arch').contains('aarch64') ? 'linux-aarch64' : 'linux-x86_64')
    systemProperty 'java.library.path',
            file("build/natives/${nativeSubdir}").absolutePath + ':' +
                    file("build/natives").absolutePath
}

// Hook the native build into the standard lifecycle: `gradlew build` should
// always produce a fresh native for the host target.
tasks.named('build') { dependsOn 'buildRustNatives' }
tasks.named('processResources') { dependsOn 'buildRustNatives' }
